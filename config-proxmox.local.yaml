# Local run of the Proxmox bridges from Clint's Mac (state under ./state).
controller:
  host: 192.0.2.1
  api_url: https://unifi.example.net
  api_key_env: STU_UNIFI_API_KEY
  site: default
state_dir: .
switches:
  - name: proxmox-1
    driver: proxmox
    ssh: root@192.0.2.101
    ip: 192.0.2.101
    model: UDC48X6
    options:
      ports: "54"
      uplink_ports: "6"
    control:
      ports: all
  - name: proxmox-2
    driver: proxmox
    ssh: root@192.0.2.102
    ip: 192.0.2.102
    model: UDC48X6
    options:
      ports: "54"
      uplink_ports: "6"
    control:
      ports: all
  - name: proxmox-3
    driver: proxmox
    ssh: root@192.0.2.103
    ip: 192.0.2.103
    model: UDC48X6
    options:
      ports: "54"
      uplink_ports: "6"
    control:
      ports: all
