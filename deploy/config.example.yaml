# switch-to-unifi configuration. Secrets never go in this file: name the
# environment variables that hold them (see deploy/env.example).
#
# One controller, any number of switches. Everything not listed here is
# discovered: identity (MAC, serial, hostname), the uplink port, the port
# layout, the UniFi model to claim, and the switch's own port capabilities.

controller:
  host: 192.0.2.1                     # where informs go (IP, or a name resolved to IPv4)
  api_url: https://unifi.example.net # optional: REST API, used only to name the device and its ports
  api_key_env: STU_UNIFI_API_KEY     # env var holding a UniFi API key (Settings → Control Plane → Integrations)
  site: default

state_dir: /var/lib/switch-to-unifi  # state/<name>/device.json (the adopted key) and inform-log/<name>/

switches:
  - name: arista                     # unique; used for state and log paths
    driver: arista-eos               # `switch-to-unifi -list-drivers`
    url: https://192.0.2.3/command-api
    username_env: STU_SWITCH_USER    # a switch user with write access if control.ports is set
    password_env: STU_SWITCH_PASS
    # ssh: admin@192.0.2.3            # alternative transport: key auth, no password
    model: auto                      # or a model code from `-list-models` (docs/unifi-models.md)
    # firmware: 7.3.109.16640        # version to report; default = the model's catalogue version.
    #                                # UniFi cannot upgrade a bridged switch: an upgrade it requests
    #                                # is emulated and the requested version reported from then on.
    control:                         # what the UniFi controller owns on this switch
      ports: all                     # "off" (read-only), "all", or a list like "2,5-8"
      igmp: true                     # per-network IGMP snooping follows UniFi
      ntp: true                      # NTP servers follow UniFi
      syslog: true                   # remote syslog host follows UniFi
      reboot: true                   # the controller's Restart really reloads the switch
      ssh_keys: true                 # the controller's SSH keys are installed on the switch user
      snmp: true                     # UniFi's SNMP v1/v2c community is configured on the switch (read-only)


  # A Proxmox VE node: its bridge is the switch, its guests are the ports
  # (docs/drivers/proxmox.md). One entry per node; guests are numbered the same on
  # every node, so a migrated VM keeps its port number.
  - name: proxmox-1
    driver: proxmox
    ssh: root@proxmox-1              # key auth
    ip: 192.0.2.101                   # the node's own in-band address
    model: UDC48X6                   # USW Leaf (48 guest ports + host + NICs); auto picks it too
    options:
      bridge: vmbr0                  # default
      # ports: "54"                  # total ports; the node's NICs take the top ones, guests the rest
      # numbering: node              # per-node guest ports (48 per node) instead of cluster-wide (48 total); UNTESTED live, PRs welcome
      # manage_lldpd: "false"        # the driver configures lldpd on the node unless told not to
      # ssh_key: /etc/switch-to-unifi/id_ed25519      # in a container
      # known_hosts: /etc/switch-to-unifi/known_hosts
    control:
      ports: all                     # port state and VLANs -> qm/pct set; on adoption the controller is seeded from the guests' VLANs
      # allow_initial_changes: true  # let the first push after adoption change ports (default: held until it matches)
      # no_seed: true                # do not write the switch's port state into the controller on adoption
      igmp: false                    # bridge-wide multicast_snooping follows UniFi
      ntp: false                     # chrony sources follow UniFi
