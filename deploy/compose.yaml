# podman-compose / docker compose. With the published image this file plus
# ./config.yaml and ./env is a complete install — no checkout, no Go:
#
#   mkdir disunified && cd disunified
#   base=https://raw.githubusercontent.com/TechBlueprints/disunified/main/deploy
#   curl -fsSLO $base/compose.yaml
#   curl -fsSL $base/config.example.yaml -o config.yaml
#   curl -fsSL $base/env.example -o env && chmod 600 env
#   # edit config.yaml and env, then:
#   docker compose up -d          # or podman-compose up -d
#
# Update: docker compose pull && docker compose up -d --force-recreate
# (--force-recreate matters: without it the old container keeps running).
services:
  disunified:
    # Pin a release (:v1.2.3) for anything you care about; :latest follows
    # releases, :edge follows main.
    image: ghcr.io/techblueprints/disunified:latest
    # To build from a source checkout instead of pulling, run compose from the
    # repo root with -f deploy/compose.yaml and uncomment:
    # build:
    #   context: ..
    #   dockerfile: Containerfile
    container_name: disunified
    restart: always            # Podman's podman-restart.service only restarts "always" containers after a host reboot
    env_file: ./env
    volumes:
      - ./config.yaml:/etc/disunified/config.yaml:ro
      - state:/var/lib/disunified
    # The bridge only makes outbound connections (to the controller's inform
    # port 8080 and the device's API); no ports need publishing -- unless a
    # UPS's NUT server is on (control.nut): then publish 3493, or give the
    # container its own LAN address with a macvlan network (and, if it
    # bridges the host it runs on, keep a bridge-network leg too: a macvlan
    # container cannot reach its own host).
    # ports:
    #   - "3493:3493"
volumes:
  state:
