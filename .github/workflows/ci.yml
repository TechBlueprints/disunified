# Build, test and (unpushed) image build on every push and pull request.
# The release workflow publishes the image; this one only proves it builds.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: No secrets or site identifiers in tracked files
        run: ./scripts/check-site-info.sh
      - name: The checker's own rules (e-mail addresses, SSH key comments)
        run: ./scripts/check-site-info_test.sh

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe, for the package version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the amd64 .deb and list it (a broken control file fails here, not in a release)
        run: |
          set -eu
          ./scripts/build-deb.sh amd64
          deb=$(ls dist/disunified_*_amd64.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run its one-shots
        run: |
          set -eu
          # buildx, not the classic builder: the Containerfile's build stage
          # pins --platform=$BUILDPLATFORM, which needs BuildKit.
          docker buildx build --load --file Containerfile \
            --build-arg VERSION=ci --tag disunified:ci .
          docker run --rm disunified:ci -build-version
          docker run --rm disunified:ci -list-drivers
