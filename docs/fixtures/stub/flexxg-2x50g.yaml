# The same cage split 2x50G (docs/breakout-lag.md §6.2): two 50G lanes, the
# two spare ports reported empty, as an unpopulated cage is.
hostname: lane-switch
serial: SSJ00000000
version: 1.0.0
capabilities: {fec: true, lacp: true, aggregate_sessions: 8}
ports:
  - {index: 1, ifname: Ethernet4, up: true, enabled: true, speed: 50000, full_duplex: true, media: QSFP28, speed_caps: [50000], fec: rs-fec, optic_present: true}
  - {index: 2, ifname: Ethernet6, up: true, enabled: true, speed: 50000, full_duplex: true, media: QSFP28, speed_caps: [50000], fec: rs-fec, optic_present: true}
  - {index: 3, enabled: true, media: SFP28}
  - {index: 4, enabled: true, media: SFP28}
  - {index: 5, ifname: Ethernet4-7, up: true, enabled: true, speed: 100000, full_duplex: true, media: QSFP28, speed_caps: [100000], optic_present: true, is_uplink: true}
