# A breakout cage presented as a five-port lane switch (docs/breakout-lag.md
# §6): four 25G lanes, the fourth up with nothing behind it, and the 100G
# cage as the uplink. The stub driver's reference file (docs/drivers/stub.md);
# claim it as model USFXG. The MAC, address, mask and gateway MAC are options
# in the device's config entry, not part of this file.
hostname: lane-switch
serial: SSJ00000000
version: 1.0.0
capabilities: {fec: true, lacp: true, aggregate_sessions: 8}
ports:
  - {index: 1, ifname: Ethernet4, up: true, enabled: true, speed: 25000, full_duplex: true, media: SFP28, speed_caps: [10000, 25000], fec: rs-fec, optic_present: true}
  - {index: 2, ifname: Ethernet5, up: true, enabled: true, speed: 25000, full_duplex: true, media: SFP28, speed_caps: [10000, 25000], fec: rs-fec, optic_present: true}
  - {index: 3, ifname: Ethernet6, up: true, enabled: true, speed: 25000, full_duplex: true, media: SFP28, speed_caps: [10000, 25000], fec: rs-fec, optic_present: true}
  - {index: 4, ifname: Ethernet7, up: true, enabled: true, speed: 25000, full_duplex: true, media: SFP28, speed_caps: [10000, 25000], fec: rs-fec, optic_present: true}
  - {index: 5, ifname: Ethernet4-7, up: true, enabled: true, speed: 100000, full_duplex: true, media: QSFP28, speed_caps: [100000], optic_present: true, is_uplink: true}
